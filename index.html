    // Helper for Gemini API exponential backoff
    async function fetchGeminiWithBackoff(url, options, maxRetries = 3, baseDelay = 1000) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return response;
          if (response.status === 429 || response.status >= 500) {
            await new Promise((res) => setTimeout(res, baseDelay * Math.pow(2, i)));
            continue;
          }
          return response;
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          await new Promise((res) => setTimeout(res, baseDelay * Math.pow(2, i)));
        }
      }
      throw new Error("Gemini API call failed after retries.");
    }

    // Convert signed 16-bit PCM Audio to WAV Blob for Gemini TTS
    function pcmToWav(pcm16, sampleRate) {
      const buffer = new ArrayBuffer(44 + pcm16.length * 2);
      const view = new DataView(buffer);

      const writeString = (v, offset, str) => {
        for (let i = 0; i < str.length; i++) {
          v.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + pcm16.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, pcm16.length * 2, true);

      for (let i = 0; i < pcm16.length; i++) {
        view.setInt16(44 + i * 2, pcm16[i], true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    const CinematicLayer = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !window.THREE) return;

        const THREE = window.THREE;
        const canvas = canvasRef.current;
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const isMobile = window.innerWidth < 768;
        const particleCount = isMobile ? 60 : 130;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const scales = new Float32Array(particleCount);

        const colorOrange = new THREE.Color(0xff7b39);
        const colorWhite = new THREE.Color(0xe2e8f0);
        const colorCyan = new THREE.Color(0x38bdf8);

        for (let i = 0; i < particleCount; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 80;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 80;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 40;

          const rand = Math.random();
          let pColor = colorOrange;
          if (rand > 0.6) pColor = colorWhite;
          else if (rand > 0.4) pColor = colorCyan;

          colors[i * 3] = pColor.r;
          colors[i * 3 + 1] = pColor.g;
          colors[i * 3 + 2] = pColor.b;

          scales[i] = Math.random() * 0.8 + 0.4;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = 32;
        textureCanvas.height = 32;
        const ctx = textureCanvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.3, 'rgba(255,123,57,0.8)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 32);

        const texture = new THREE.CanvasTexture(textureCanvas);
        const material = new THREE.PointsMaterial({
          size: 1.2,
          map: texture,
          transparent: true,
          blending: THREE.AdditiveBlending,
          vertexColors: true,
          depthWrite: false,
          opacity: 0.65
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        let mouseX = 0;
        let mouseY = 0;
        const handleMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        let animationFrameId;
        let clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          particles.rotation.y = elapsedTime * 0.03;
          particles.rotation.x = Math.sin(elapsedTime * 0.02) * 0.05;

          camera.position.x += (mouseX * 2 - camera.position.x) * 0.03;
          camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
          camera.lookAt(scene.position);

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          geometry.dispose();
          material.dispose();
          texture.dispose();
          renderer.dispose();
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-10 w-full h-full"
        />
      );
    };
